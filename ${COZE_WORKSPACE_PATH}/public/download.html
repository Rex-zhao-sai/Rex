<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TK0027 Test Concept - Download</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
            background: white;
            padding: 3rem;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 500px;
        }
        h1 {
            color: #1e293b;
            margin-bottom: 0.5rem;
            font-size: 1.8rem;
        }
        .subtitle {
            color: #64748b;
            margin-bottom: 2rem;
        }
        .file-info {
            background: #f8fafc;
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 2rem;
            text-align: left;
        }
        .file-name {
            font-weight: 600;
            color: #1e293b;
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
        }
        .file-size {
            color: #64748b;
            font-size: 0.9rem;
        }
        .download-btn {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 1rem 2.5rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            transition: transform 0.2s, box-shadow 0.2s;
            border: none;
            cursor: pointer;
        }
        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        .download-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .preview {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid #e2e8f0;
        }
        .preview h3 {
            color: #1e293b;
            margin-bottom: 1rem;
        }
        .preview-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-top: 1rem;
        }
        .preview-item {
            padding: 1rem;
            border-radius: 8px;
            color: white;
            font-weight: 600;
        }
        .ict { background: #2563eb; }
        .fct { background: #22c55e; }
        .eol { background: #f97316; }
        .status {
            margin-top: 1rem;
            padding: 0.75rem;
            border-radius: 6px;
            font-size: 0.9rem;
        }
        .status.success {
            background: #dcfce7;
            color: #166534;
        }
        .status.error {
            background: #fee2e2;
            color: #991b1b;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 TK0027 Test Concept</h1>
        <p class="subtitle">优化后的三栏布局 PPT</p>
        
        <div class="file-info">
            <div class="file-name">📄 TK0027_Test_Concept_Optimized.pptx</div>
            <div class="file-size">大小：31 KB | 格式：PowerPoint</div>
        </div>

        <button class="download-btn" id="downloadBtn" onclick="downloadFile()">
            ⬇️ 下载 PPT 文件
        </button>

        <div id="status"></div>

        <div class="preview">
            <h3>布局预览</h3>
            <div class="preview-grid">
                <div class="preview-item ict">ICT<br><small>In-Circuit Test</small></div>
                <div class="preview-item fct">FCT<br><small>Functional Test</small></div>
                <div class="preview-item eol">EOL<br><small>End-of-Line Test</small></div>
            </div>
            <p style="color: #64748b; margin-top: 1rem; font-size: 0.9rem;">
                三栏并排对比 · 彩色区分 · 关键指标汇总
            </p>
        </div>
    </div>

    <script>
        async function downloadFile() {
            const btn = document.getElementById('downloadBtn');
            const status = document.getElementById('status');
            
            btn.disabled = true;
            btn.textContent = '⏳ 下载中...';
            status.innerHTML = '';
            
            try {
                const response = await fetch('/api/download-ppt');
                
                if (!response.ok) {
                    throw new Error('下载失败');
                }
                
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'TK0027_Test_Concept_Optimized.pptx';
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);
                
                status.innerHTML = '<div class="status success">✅ 下载成功！请检查下载文件夹</div>';
                btn.textContent = '✅ 已下载';
            } catch (error) {
                status.innerHTML = '<div class="status error">❌ 下载失败：' + error.message + '</div>';
                btn.disabled = false;
                btn.textContent = '⬇️ 重试下载';
            }
        }
    </script>
</body>
</html>
