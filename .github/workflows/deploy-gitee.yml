name: Deploy to Gitee Pages

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install pnpm
        run: npm install -g pnpm
      
      - name: Install dependencies
        run: pnpm install
      
      - name: Build
        run: pnpm build
        env:
          GITEE_PAGES: '1'
      
      - name: Deploy to Gitee
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.GITEE_TOKEN }}
          external_repository: rex-zhao/shebeibaoyang
          publish_branch: gh-pages
          publish_dir: ./out
