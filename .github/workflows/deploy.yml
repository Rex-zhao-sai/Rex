name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 */7 * *'  # 每 7 天运行一次（重新生成预签名 URL）
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install
      - name: Generate presigned URLs
        run: npx tsx scripts/generate-presigned-urls.ts
        env:
          COZE_BUCKET_ENDPOINT_URL: ${{ secrets.COZE_BUCKET_ENDPOINT_URL }}
          COZE_BUCKET_NAME: ${{ secrets.COZE_BUCKET_NAME }}
          COZE_BUCKET_REGION: ${{ secrets.COZE_BUCKET_REGION }}
          NEXT_PUBLIC_TURSO_URL: ${{ secrets.NEXT_PUBLIC_TURSO_URL }}
          NEXT_PUBLIC_TURSO_AUTH_TOKEN: ${{ secrets.NEXT_PUBLIC_TURSO_AUTH_TOKEN }}
      - name: Generate upload URLs
        run: npx tsx scripts/generate-upload-urls.ts
        env:
          COZE_BUCKET_ENDPOINT_URL: ${{ secrets.COZE_BUCKET_ENDPOINT_URL }}
          COZE_BUCKET_NAME: ${{ secrets.COZE_BUCKET_NAME }}
          COZE_BUCKET_REGION: ${{ secrets.COZE_BUCKET_REGION }}
          NEXT_PUBLIC_TURSO_URL: ${{ secrets.NEXT_PUBLIC_TURSO_URL }}
          NEXT_PUBLIC_TURSO_AUTH_TOKEN: ${{ secrets.NEXT_PUBLIC_TURSO_AUTH_TOKEN }}
      - name: Build for GitHub Pages
        run: |
          # Temporarily disable API routes for static export
          mv src/app/api src/app/_api_disabled 2>/dev/null || true
          # Build with GitHub Pages config
          GITHUB_PAGES=1 pnpm build 2>&1 | tee build.log
          # Check build result
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "Build failed! Last 50 lines of build log:"
            tail -n 50 build.log
            exit 1
          fi
          # Restore API routes
          mv src/app/_api_disabled src/app/api 2>/dev/null || true
          # Verify output
          echo "Build output:"
          ls -la out/ || echo "out directory not found"
          find out -type f | wc -l
        env:
          NEXT_PUBLIC_TURSO_URL: ${{ secrets.NEXT_PUBLIC_TURSO_URL }}
          NEXT_PUBLIC_TURSO_AUTH_TOKEN: ${{ secrets.NEXT_PUBLIC_TURSO_AUTH_TOKEN }}
          COZE_BUCKET_ENDPOINT_URL: ${{ secrets.COZE_BUCKET_ENDPOINT_URL }}
          COZE_BUCKET_NAME: ${{ secrets.COZE_BUCKET_NAME }}
          COZE_BUCKET_REGION: ${{ secrets.COZE_BUCKET_REGION }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
