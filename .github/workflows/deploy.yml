name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 */7 * *'  # 每 7 天运行一次（重新生成预签名 URL）
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install
      - name: Generate presigned URLs
        run: npx tsx scripts/generate-presigned-urls.ts
        env:
          COZE_BUCKET_ENDPOINT_URL: ${{ secrets.COZE_BUCKET_ENDPOINT_URL }}
          COZE_BUCKET_NAME: ${{ secrets.COZE_BUCKET_NAME }}
          COZE_BUCKET_REGION: ${{ secrets.COZE_BUCKET_REGION }}
          NEXT_PUBLIC_TURSO_URL: ${{ secrets.NEXT_PUBLIC_TURSO_URL }}
          NEXT_PUBLIC_TURSO_AUTH_TOKEN: ${{ secrets.NEXT_PUBLIC_TURSO_AUTH_TOKEN }}
      - name: Generate upload URLs
        run: npx tsx scripts/generate-upload-urls.ts
        env:
          COZE_BUCKET_ENDPOINT_URL: ${{ secrets.COZE_BUCKET_ENDPOINT_URL }}
          COZE_BUCKET_NAME: ${{ secrets.COZE_BUCKET_NAME }}
          COZE_BUCKET_REGION: ${{ secrets.COZE_BUCKET_REGION }}
          NEXT_PUBLIC_TURSO_URL: ${{ secrets.NEXT_PUBLIC_TURSO_URL }}
          NEXT_PUBLIC_TURSO_AUTH_TOKEN: ${{ secrets.NEXT_PUBLIC_TURSO_AUTH_TOKEN }}
      - run: pnpm run build:github
        env:
          NEXT_PUBLIC_TURSO_URL: ${{ secrets.NEXT_PUBLIC_TURSO_URL }}
          NEXT_PUBLIC_TURSO_AUTH_TOKEN: ${{ secrets.NEXT_PUBLIC_TURSO_AUTH_TOKEN }}
          COZE_BUCKET_ENDPOINT_URL: ${{ secrets.COZE_BUCKET_ENDPOINT_URL }}
          COZE_BUCKET_NAME: ${{ secrets.COZE_BUCKET_NAME }}
          COZE_BUCKET_REGION: ${{ secrets.COZE_BUCKET_REGION }}
      - name: Verify out directory
        run: |
          echo "Checking out directory..."
          ls -la out/ || echo "out directory not found"
          find out -type f | head -20
          echo "Total files: $(find out -type f | wc -l)"
          echo "Total size: $(du -sh out/)"
      - uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ./out
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: ./out
      - name: Deploy to gh-pages branch
        run: |
          # Clone gh-pages branch or create if not exists
          git clone --branch gh-pages --single-branch https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git gh-pages 2>/dev/null || (git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git gh-pages && cd gh-pages && git checkout --orphan gh-pages)
          cd gh-pages
          # Remove old files
          rm -rf *
          # Copy new files
          cp -r ../out/* ./
          # Commit and push
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m "Deploy from main@${{ github.sha }}"
          git push origin gh-pages
