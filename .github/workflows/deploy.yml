name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 */7 * *'  # 每 7 天运行一次（重新生成预签名 URL）
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install
      - name: Generate presigned URLs
        run: npx tsx scripts/generate-presigned-urls.ts
        env:
          COZE_BUCKET_ENDPOINT_URL: ${{ secrets.COZE_BUCKET_ENDPOINT_URL }}
          COZE_BUCKET_NAME: ${{ secrets.COZE_BUCKET_NAME }}
          COZE_BUCKET_REGION: ${{ secrets.COZE_BUCKET_REGION }}
          NEXT_PUBLIC_TURSO_URL: ${{ secrets.NEXT_PUBLIC_TURSO_URL }}
          NEXT_PUBLIC_TURSO_AUTH_TOKEN: ${{ secrets.NEXT_PUBLIC_TURSO_AUTH_TOKEN }}
      - name: Generate upload URLs
        run: npx tsx scripts/generate-upload-urls.ts
        env:
          COZE_BUCKET_ENDPOINT_URL: ${{ secrets.COZE_BUCKET_ENDPOINT_URL }}
          COZE_BUCKET_NAME: ${{ secrets.COZE_BUCKET_NAME }}
          COZE_BUCKET_REGION: ${{ secrets.COZE_BUCKET_REGION }}
          NEXT_PUBLIC_TURSO_URL: ${{ secrets.NEXT_PUBLIC_TURSO_URL }}
          NEXT_PUBLIC_TURSO_AUTH_TOKEN: ${{ secrets.NEXT_PUBLIC_TURSO_AUTH_TOKEN }}
      - run: pnpm run build:github
        env:
          NEXT_PUBLIC_TURSO_URL: ${{ secrets.NEXT_PUBLIC_TURSO_URL }}
          NEXT_PUBLIC_TURSO_AUTH_TOKEN: ${{ secrets.NEXT_PUBLIC_TURSO_AUTH_TOKEN }}
          COZE_BUCKET_ENDPOINT_URL: ${{ secrets.COZE_BUCKET_ENDPOINT_URL }}
          COZE_BUCKET_NAME: ${{ secrets.COZE_BUCKET_NAME }}
          COZE_BUCKET_REGION: ${{ secrets.COZE_BUCKET_REGION }}
      - name: Verify out directory
        run: |
          echo "Checking out directory..."
          ls -la out/ || echo "out directory not found"
          find out -type f | head -20
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
